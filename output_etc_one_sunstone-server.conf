# Deep VM search configuration
# Define keys from VM template that can be searched.
# Each entry has:
#   key: template attribute path (dot notation, e.g., USER_TEMPLATE.DEPARTMENT)
#   pattern: regex pattern to match against the value (e.g., "^.*$" for any)
#   label: display name in UI dropdown (optional, defaults to key)
vm_search_keys: [
  { key: "USER_TEMPLATE.DEPARTMENT", pattern: "^[A-Za-z]+$", label: "Department" },
  { key: "USER_TEMPLATE.PROJECT", pattern: "^.*$", label: "Project" },
  { key: "TEMPLATE.OS", pattern: "^(linux|windows)$" }
]