PidFile /tmp/ovirtapi-server.pid

User oneadmin
Group oneadmin

LoadModule passenger_module modules/mod_passenger.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule deflate_module modules/mod_deflate.so

PassengerMaxPoolSize 30

<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json
  SetEnvIf Request_URI \.(?:gif|jpe?g|png|pdf)$ no-gzip
</IfModule>

<VirtualHost *:80>
  PassengerUser oneadmin
  PassengerAppRoot /usr/lib/one/ovirtapi-server
  PassengerEnabled on
  PassengerRuby /usr/bin/ruby

  <Location "/ovirt-engine/services/pki-resource">
    Require all granted
  </Location>

  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/ovirt-engine/services/pki-resource$ [NC]
  RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
  SSLEngine on
  SSLCertificateFile /etc/one/ovirtapi-ssl.crt
  SSLCertificateKeyFile /etc/one/ovirtapi-ssl.key

  SetEnv GEM_PATH /usr/share/one/gems/
  SetEnv GEM_HOME /usr/share/one/gems/

  PassengerUser oneadmin
  PassengerAppRoot /usr/lib/one/ovirtapi-server
  PassengerEnabled on
  PassengerRuby /usr/bin/ruby
  PassengerMinInstances 5

  LimitRequestBody 0

  <Directory /usr/lib/one/ovirtapi-server>
    AllowOverride all
    Require all granted
  </Directory>
</VirtualHost>
