PidFile /tmp/ovirtapi-server.pid

# Must use the oneadmin user
User oneadmin
Group oneadmin

# Load required modules
LoadModule passenger_module modules/mod_passenger.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule deflate_module modules/mod_deflate.so

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json
    SetEnvIf Request_URI \.(?:gif|jpe?g|png|pdf)$ no-gzip
</IfModule>

# HTTP endpoints
<VirtualHost *:80>
    PassengerAppRoot /var/www/ovirtapi-server
    PassengerEnabled on
    PassengerRuby /usr/bin/ruby

    <Location "/ovirt-engine/services/pki-resource">
        Require all granted
    </Location>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/ovirt-engine/services/pki-resource$ [NC]
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# HTTPs endpoints
<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/one/ovirtapi/ovirtapi-ssl.crt
    SSLCertificateKeyFile /etc/one/ovirtapi/ovirtapi-ssl.key

    PassengerAppRoot /var/www/ovirtapi-server
    PassengerEnabled on
    PassengerRuby /usr/bin/ruby

    <Directory /var/www/ovirtapi-server>
        AllowOverride all
        Require all granted
    </Directory>
</VirtualHost>
