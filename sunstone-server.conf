# Deep VM search configuration
# Define searchable template keys and their regex patterns
# The regex is applied to the filter value; use '^' for prefix, '^...$' for exact match
:vm_deep_search:
  :keys:
    "NAME": "^"
    "TEMPLATE.DESCRIPTION": ".*"
    "TEMPLATE.OS.ARCH": "^"
    "USER_TEMPLATE.COST_CENTER": "^$"