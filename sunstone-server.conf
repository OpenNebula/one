# Advanced VM search configuration
# Define additional searchable keys for VM deep search.
# Format: key: <template_key>, regex: <pattern>
vm_search_advanced: [
  { key: "MEMORY", regex: "^\\d+$" },
  { key: "CPU", regex: "^\\d+(\.\\d+)?$" },
  { key: "OS/ARCH", regex: "^[a-zA-Z0-9_]+$" },
  { key: "OS/BOOT", regex: ".*" },
  { key: "DISK/IMAGE", regex: "^[a-zA-Z0-9_\\-]+$" },
  { key: "NIC/NETWORK", regex: "^[a-zA-Z0-9_\\-]+$" },
  { key: "CONTEXT/NETWORK", regex: "^YES|NO$" },
  { key: "USER_TEMPLATE/DESCRIPTION", regex: ".*" }
]