##################################################
# Deep VM Search Configuration
# Define template keys and regex patterns for advanced search.
# Format: key = <template_attribute> <regex_pattern>
# The regex pattern is used to constrain how user input is compared.
# Use '.*' for substring match, '^...$' for exact match, etc.
##################################################
:vm_search_keys:
  - key: TEMPLATE.NAME
    regex: '.*'
  - key: TEMPLATE.DESCRIPTION
    regex: '.*'
  - key: TEMPLATE.OS
    regex: '.*'
  - key: TEMPLATE.OWNER
    regex: '.*'