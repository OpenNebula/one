# Deep VM Search Configuration
# Define searchable VM template attributes with regex patterns.
# Format: attribute_name = "regex_pattern"
# The regex is applied to the string representation of the attribute value.
# Use ^ for prefix-anchored, $ for exact-match, or leave plain for substring.
# Example:
#   deep_vm_search_attributes = [
#     "TEMPLATE.USERDATA = ^#cloud-config",
#     "TEMPLATE.OS.ARCH = ^x86_64$",
#     "TEMPLATE.NETWORK.VLAN_ID = ^[0-9]+$",
#     "TEMPLATE.CONTEXT.NIC_ID = .*"
#   ]
#
# This setting must be included in the main configuration block (e.g., under :sunstone).
:deep_vm_search:
  :attributes:
    - "TEMPLATE.USERDATA = ^#cloud-config"
    - "TEMPLATE.OS.ARCH = ^x86_64$"
    - "TEMPLATE.NETWORK.VLAN_ID = ^[0-9]+$"
    - "TEMPLATE.CONTEXT.NIC_ID = .*"
