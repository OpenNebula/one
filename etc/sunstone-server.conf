# Sunstone configuration
# Timezone mode: 'browser' (default) or 'os'
# Set to 'os' to use the server's system timezone and locale
TIMEZONE_MODE = browser

# Optional: specify timezone if mode is 'os' (e.g., 'UTC', 'America/New_York')
# If empty, automatically detected from system
CURRENT_TIMEZONE = 

# Date format: '24h' or '12h' (am-pm). Only used if TIMEZONE_MODE = os
DATE_FORMAT = 24h

# other configuration...