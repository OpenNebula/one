# Sunstone server configuration
# Time configuration source: 'browser' or 'os'
# 'browser' uses the visitor's browser timezone (default)
# 'os' uses the server's OS timezone configuration
currentTimeZone = UTC

# Date format: '24h' or '12h'
dateFormat = 24h

# Source of time configuration: browser or os
timeConfigSource = os

# Other configurations...
