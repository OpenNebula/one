# Advanced VM search configuration
# Define template keys and regex patterns for deep search
:vm_search_keys:
  name: '^.*$'        # exact prefix match not enforced, here any value matches
  memory: '^\d+$'     # only numeric values
  cpu: '^\d+(\.\d+)?$'
  graphics_type: '^(vnc|spice)$'
  os_arch: '^(x86_64|i386)$'