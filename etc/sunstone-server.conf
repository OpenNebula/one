# Sunstone server configuration
# ... other settings ...

# Advanced VM search attributes
# Each entry has a key (template attribute) and a regex pattern for matching
# The key uses dot notation for nested attributes, e.g., "USER_TEMPLATE.description"
vm_search_attributes {
    "USER_TEMPLATE.description" = ".*"
    "USER_TEMPLATE.department" = "^(sales|engineering|hr)$"
    "TEMPLATE.OS.ARCH" = "^x86_64$"
}
