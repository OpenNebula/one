# Sunstone server configuration
# Timezone configuration:
# - "browser": use browser's timezone (default)
# - "server": use the server's OS timezone (set via timedatectl)
# If set to a specific timezone string (e.g., "America/New_York"), that timezone is used.
timezone: browser

# Date format: "24h" or "12h" (am/pm). Default is 24h.
date_format: 24h
