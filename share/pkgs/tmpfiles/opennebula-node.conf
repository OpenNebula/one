# Create the OpenNebula remote scripts directory and its metrics DB
# sibling. The remotes are synced into it from the Front-end by the
# unprivileged oneadmin user, which cannot create it under /var/lib.
d /var/lib/one-remotes    0755 oneadmin oneadmin -
d /var/lib/one-remotes-db 0755 oneadmin oneadmin -
