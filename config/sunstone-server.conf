# Sunstone server configuration
# ... other settings ...

# Timezone mode: 'browser' (default) or 'server'
# When 'browser', timestamps are sent in UTC and displayed in the browser's timezone.
# When 'server', timestamps are formatted server-side using the server's timezone
# (or the timezone specified in 'currentTimeZone' if set).
:timezone_mode: browser

# Optional timezone string (e.g., 'America/New_York') to use when timezone_mode is 'server'.
# If not set, the server's OS timezone is used.
:currentTimeZone: ''
